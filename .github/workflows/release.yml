# The AYN Thor fork's release: a tag v<upstream version>-thor.<n> builds the release APK with .github/release-build.sh (upstream's own recipe: the games of
# peanuts/release-titles.txt, the real on-device packer, upstream's prewarm seeds, the fork's release key) and publishes it as a GitHub Release, which Obtainium
# installs from (README.md "Release"). The release key comes from the repository secrets NX_SIGN_STORE_BASE64 (the keystore, base64), NX_SIGN_ALIAS and NX_SIGN_PASS.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment), as in peanuts.yml.
jobs:
  apk:
    name: Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: The packer stage's tools and the NDK of build.gradle's ndkVersion
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q zsh ninja-build
          ndk=$(sed -n "s/.*ndkVersion '\([0-9.]*\)'.*/\1/p" android/app/build.gradle)
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null   # yes ends with SIGPIPE under pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - name: The release key
        env:
          NX_SIGN_STORE_BASE64: ${{ secrets.NX_SIGN_STORE_BASE64 }}
        run: |
          [ -n "$NX_SIGN_STORE_BASE64" ] || { echo "::error::the repository secret NX_SIGN_STORE_BASE64 is not set (README.md \"Release\")"; exit 1; }
          echo "$NX_SIGN_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NX_SIGN_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        env:
          NX_SIGN_ALIAS: ${{ secrets.NX_SIGN_ALIAS }}
          NX_SIGN_PASS: ${{ secrets.NX_SIGN_PASS }}
        run: .github/release-build.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are the annotated tag's message; a lightweight tag gets GitHub's generated notes
          notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          if [ -n "$notes" ]; then printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"; opt=(--notes-file "$RUNNER_TEMP/notes.md"); else opt=(--generate-notes); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then   # the release exists already (published by hand): this build's APK replaces its asset
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.apk --verify-tag --title "Peanuts Native ${GITHUB_REF_NAME#v} (AYN Thor fork)" "${opt[@]}"
          fi
